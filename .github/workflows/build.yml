name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Convert iOS theme -> Android resources
        run: python tools/inject.py
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp build/outputs/apk/debug/*.apk out/kakaotheme.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kakaotheme-apk
          path: out/kakaotheme.apk
